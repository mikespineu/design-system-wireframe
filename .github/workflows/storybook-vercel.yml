name: Storybook to Vercel

# Every push to every branch deploys Storybook to Vercel.
# main -> production, any other branch -> preview URL.
on:
  push:
    branches: ['**']

concurrency:
  group: storybook-vercel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'storybook-production' || 'storybook-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      # Package the static site in Vercel's Build Output format so Vercel skips its own
      # build (the project would otherwise run `vite build`).
      - name: Prepare Vercel output
        run: |
          mkdir -p .vercel/output
          cp -R storybook-static .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
          BRANCH: ${{ github.ref_name }}
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --yes --token "$VERCEL_TOKEN" $PROD_FLAG)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Storybook deployed"
            echo "- Branch: \`$BRANCH\`"
            echo "- URL: $url"
          } >> "$GITHUB_STEP_SUMMARY"
